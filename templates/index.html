<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE SYSTEM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="system-box">
        <div class="header">
            <span id="rank">E-RANK</span>
            <div class="exp-bar"><div id="exp-fill"></div></div>
            <span id="level">LVL 1</span>
        </div>

        <h1>[SYSTEM] ARISE</h1>
        <p id="system-msg"></p>

        <!-- النظام الذكي الجديد -->
        <div id="smart-setup" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin: 15px 0;">
            <label>السنة:
                <select id="year" onchange="updateSubjects()" style="padding:5px; border-radius:8px; width:100%; margin-bottom:10px;">
                    <option value="">اختر السنة</option>
                    <option value="اولى ابتدائي">اولى ابتدائي</option>
                    <option value="تانية ابتدائي">تانية ابتدائي</option>
                    <option value="تالتة ابتدائي">تالتة ابتدائي</option>
                    <option value="رابعة ابتدائي">رابعة ابتدائي</option>
                    <option value="خامسة ابتدائي">خامسة ابتدائي</option>
                    <option value="ساتة ابتدائي">ساتة ابتدائي</option>
                    <option value="اولى اعدادي">اولى اعدادي</option>
                    <option value="تانية اعدادي">تانية اعدادي</option>
                    <option value="تالتة اعدادي">تالتة اعدادي</option>
                    <option value="اولى ثانوي">اولى ثانوي</option>
                    <option value="تانية ثانوي">تانية ثانوي</option>
                    <option value="تالتة ثانوي">تالتة ثانوي</option>
                </select>
            </label>

            <div style="display:flex; gap:5px; margin-top:10px;">
                <select id="subject" style="flex:1; padding:8px; border-radius:8px;">
                    <option value="">اختر السنة الأول</option>
                </select>
                <select id="difficulty" style="padding:8px; border-radius:8px;">
                    <option value="easy">سهل 😴 (25د)</option>
                    <option value="medium" selected>متوسط 😐 (45د)</option>
                    <option value="hard">صعب 🔥 (60د)</option>
                </select>
                <button onclick="addSmartQuest()" style="padding:8px 12px;">+ إضافة</button>
            </div>
            
            <div id="smart-list" style="margin-top:15px; text-align:right;"></div>
            
            <button onclick="startSmartSystem()" style="width:100%; margin-top:15px; padding:12px; background:#00ff88; border:none; border-radius:8px; font-weight:bold; font-size:18px;">ARISE - ابدأ الخطة الذكية</button>
        </div>

        <div id="quest-list"></div>
        <div id="timer-box" class="hidden">
            <h2 id="current-task">...</h2>
            <div id="timer">30:00</div>
            <div id="time-info" style="font-size:14px; opacity:0.7;"></div>
            <button onclick="completeQuest()">تمت المهمة ✓</button>
            <button onclick="failQuest()" class="fail-btn">فشل</button>
        </div>
        <div id="penalty-box" class="hidden penalty">
            <h1>⚠ [PENALTY QUEST] ⚠</h1>
            <p>فشلت! عقابك: 20 ضغط!</p>
            <button onclick="closePenalty()">تم العقاب</button>
        </div>
    </div>
    <audio id="alarm" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
    <audio id="arise-sound" src="https://cdn.pixabay.com/audio/2022/03/24/audio_4d9c8d0e7a.mp3"></audio>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
