<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARISE - Monarch Access</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Segoe UI',sans-serif}
body{
  background:#000;
  background-image: 
    radial-gradient(circle at 20% 30%, #00e5ff15 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, #00e5ff0a 0%, transparent 50%);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  overflow:hidden;
}
body::before{
  content:'';
  position:absolute;width:600px;height:600px;
  background:radial-gradient(circle, #00e5ff08, transparent 70%);
  animation: pulse 4s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.2);opacity:.8}}

.card{
  position:relative;
  width:100%;max-width:400px;
  background:linear-gradient(180deg, #0f0f0f 0%, #080808 100%);
  border:1px solid #1a1a1a;
  border-top:1px solid #00e5ff66;
  box-shadow: 0 0 0 1px #00e5ff22, 0 0 60px #00e5ff18, 0 20px 60px #000;
  border-radius:24px;padding:36px;
  animation: rise .8s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.logo-wrap{text-align:center;margin-bottom:28px}
h1 { 
  background: linear-gradient(180deg,#fff,#00e5ff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
p.sub{color:#666;text-align:center;margin:10px 0 0;font-size:12px;letter-spacing:3px;text-transform:uppercase}
.line{height:1px;background:linear-gradient(90deg, transparent, #00e5ff33, transparent);margin:26px 0}

.input-group{position:relative;margin-bottom:16px}
.input-group span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#444;font-size:14px}
input{
  width:100%;background:#0e0e0e;border:1px solid #1e1e1e;border-radius:14px;
  padding:15px 14px 15px 40px;color:#fff;outline:none;transition:.3s;font-size:14px
}
input:focus{border-color:#00e5ff;background:#111;box-shadow:0 0 0 3px #00e5ff15, 0 0 20px #00e5ff20}
input::placeholder{color:#555}

button{
  width:100%;background:linear-gradient(180deg, #00e5ff, #00b8cc);color:#000;
  border:none;border-radius:14px;padding:15px;font-weight:900;font-size:15px;
  cursor:pointer;letter-spacing:1px;box-shadow:0 0 20px #00e5ff66, inset 0 1px 0 #ffffff88;
  transition:.2s;margin-top:8px;position:relative;overflow:hidden
}
button::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg, transparent, #ffffff55, transparent);transition:.6s
}
button:hover::before{left:100%}
button:hover{transform:translateY(-1px);box-shadow:0 0 30px #00e5ff88}
button:active{transform:scale(.98)}

.error{
  background:linear-gradient(180deg, #ff003315, #ff003308);
  border:1px solid #ff003333;color:#ff6b6b;padding:12px;border-radius:12px;
  text-align:center;margin-bottom:18px;font-size:13px;animation:shake .4s
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.link{text-align:center;margin-top:22px;color:#555;font-size:13px}
.link a{color:#00e5ff;text-decoration:none;font-weight:700;transition:.2s}
.link a:hover{color:#fff;text-shadow:0 0 10px #00e5ff}
.footer{margin-top:28px;text-align:center;color:#222;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <h1>ARISE</h1>
    <p class="sub">Monarch System • Private Access</p>
  </div>
  <div class="line"></div>
  
  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="input-group">
      <span>✉️</span>
      <input type="email" name="email" placeholder="البريد الإلكتروني" required>
    </div>
    <div class="input-group">
      <span>🔒</span>
      <input type="password" name="password" placeholder="كلمة المرور" required>
    </div>
    <button type="submit">دخول النظام ⚡</button>
  </form>

  <div class="link">معندكش حساب؟ <a href="/register">إنشاء حساب جديد</a></div>
  <div class="footer">SECURED BY ARISE CORE • 2026</div>
</div>
</body>
</html>
