<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARISE - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Tahoma}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.card{width:100%;max-width:380px;background:#0a0a0a;border:1px solid #00e5ff;box-shadow:0 0 25px #00e5ff55;border-radius:20px;padding:30px;}
h1{color:#00e5ff;text-align:center;font-size:28px;letter-spacing:3px;text-shadow:0 0 10px #00e5ff}
p.sub{color:#888;text-align:center;margin:8px 0 25px;font-size:13px}
input{width:100%;background:#111;border:1px solid #222;border-radius:12px;padding:14px;color:#fff;margin-bottom:15px;outline:none;transition:.3s}
input:focus{border-color:#00e5ff;box-shadow:0 0 10px #00e5ff55}
button{width:100%;background:#00e5ff;color:#000;border:none;border-radius:12px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 0 15px #00e5ff;transition:.2s}
button:active{transform:scale(.97)}
.link{text-align:center;margin-top:18px;color:#aaa;font-size:14px}
.link a{color:#00e5ff;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>ARISE SYSTEM</h1>
<p class="sub">Welcome back, Monarch</p>
<form method="POST">
<input type="email" name="email" placeholder="الايميل" required>
<input type="password" name="password" placeholder="الباسورد" required>
<button type="submit">دخول ⚡</button>
</form>
<div class="link">معندكش حساب؟ <a href="/register">سجل دلوقتي</a></div>
</div>
</body>
</html>
